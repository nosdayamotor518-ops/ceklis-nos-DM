<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOS Monitoring Audit Cabang</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN untuk render JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // ⚠️ GANTI DENGAN URL GOOGLE APPS SCRIPT ANDA ⚠️
    // ==========================================
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbxusK0G3dEYkmUziYS1TtfdAasHUI6gNBkCq_PQMUZjPfmxl3TAQ6wH6IG-3SgN0vQTiA/exec";

    // Data Konfigurasi Visual Tier Gamifikasi
    const TIER_CONFIG = {
      Bronze: {
        name: 'BRONZE TIER',
        subtitle: 'Status Awal / Standar Dasar',
        gradient: 'from-amber-900 via-yellow-950 to-slate-900',
        border: 'border-amber-700/50',
        textAccent: 'text-amber-400',
        glow: 'shadow-amber-900/40',
        icon: '🥉',
        challengeText: 'Wajib penuhi 100% item mandatory (S,G,P) dengan status "Exist Good" untuk naik ke SILVER TIER!'
      },
      Silver: {
        name: 'SILVER TIER',
        subtitle: 'Memenuhi Kualifikasi Standar',
        gradient: 'from-slate-800 via-slate-900 to-zinc-950',
        border: 'border-slate-400/50',
        textAccent: 'text-slate-200',
        glow: 'shadow-slate-500/30',
        icon: '🥈',
        challengeText: 'Hebat! Penuhi item mandatory (G,P) dengan status "Exist Good" untuk meraih GOLD TIER!'
      },
      Gold: {
        name: 'GOLD TIER',
        subtitle: 'Performa Audit Sangat Baik',
        gradient: 'from-amber-600 via-yellow-600 to-amber-800',
        border: 'border-yellow-300/70',
        textAccent: 'text-yellow-200',
        glow: 'shadow-yellow-500/50',
        icon: '🥇',
        challengeText: 'Satu langkah lagi! Penuhi item mandatory (P) dengan status "Exist Good" untuk puncak PLATINUM!'
      },
      Platinum: {
        name: 'PLATINUM TIER',
        subtitle: 'Kualitas Operasional Sempurna',
        gradient: 'from-cyan-600 via-indigo-700 to-fuchsia-700',
        border: 'border-cyan-300/80',
        textAccent: 'text-cyan-200',
        glow: 'shadow-cyan-500/60',
        icon: '👑',
        challengeText: 'Luar Biasa! Seluruh item mandatory (S,G,P | G,P | P) berstatus Exist Good!'
      }
    };

    function App() {
      const [gasUrl, setGasUrl] = useState(localStorage.getItem('NOS_GAS_URL') || DEFAULT_GAS_URL);
      const [view, setView] = useState('setup'); // 'setup', 'dashboard', 'form'
      const [cabangList, setCabangList] = useState([]);
      const [loading, setLoading] = useState(false);

      // State Data Audit
      const [kodeCabang, setKodeCabang] = useState('');
      const [namaCabang, setNamaCabang] = useState('');
      const [namaAuditor, setNamaAuditor] = useState('');
      const [jabatan, setJabatan] = useState('');
      const [selectedSection, setSelectedSection] = useState('ALL');
      const [sessionId, setSessionId] = useState('');

      // State Checklist & Dashboard Data
      const [checklistItems, setChecklistItems] = useState({});
      const [dashboardData, setDashboardData] = useState({
        currentTier: 'Bronze',
        unfinishedCounter: {
          'H1 Premises': 0, 'H1 People': 0, 'H1 Process': 0,
          'H23 Premises': 0, 'H23 People': 0, 'H23 Process': 0
        }
      });

      // Fetch Master Cabang saat pertama kali dimuat
      useEffect(() => {
        if (gasUrl && gasUrl !== "GANTI_DENGAN_WEB_APP_URL_GAS_ANDA") {
          loadCabangList();
        }
      }, [gasUrl]);

      const loadCabangList = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${gasUrl}?action=getCabang`);
          const data = await res.json();
          if (Array.isArray(data)) setCabangList(data);
        } catch (err) {
          alert("Gagal memuat Master Cabang dari Google Sheet. Pastikan Web App URL sudah benar.");
        } finally {
          setLoading(false);
        }
      };

      // Mulai / Lanjutkan Sesi Audit
      const handleStartAudit = async (targetView = 'dashboard') => {
        if (!kodeCabang || !namaAuditor) {
          alert("Silakan pilih Cabang dan isi Nama Auditor terlebih dahulu!");
          return;
        }

        setLoading(true);
        try {
          // Init / Resume Session
          const sessionRes = await fetch(`${gasUrl}?action=startOrResumeSession&kodeCabang=${kodeCabang}&namaUser=${encodeURIComponent(namaAuditor)}&jabatan=${encodeURIComponent(jabatan)}&section=${selectedSection}`);
          const sessionData = await sessionRes.json();
          
          if (sessionData.sessionId) {
            setSessionId(sessionData.sessionId);
            setNamaCabang(sessionData.namaCabang);
          }

          // Load Dashboard
          const dashRes = await fetch(`${gasUrl}?action=getDashboard&kodeCabang=${kodeCabang}`);
          const dashData = await dashRes.json();
          if (dashData.status === 'success') {
            setDashboardData(dashData);
          }

          // Load Items
          const checkRes = await fetch(`${gasUrl}?action=getChecklist&kodeCabang=${kodeCabang}&section=${selectedSection}`);
          const checkData = await checkRes.json();
          setChecklistItems(checkData);

          setView(targetView);
        } catch (err) {
          alert("Gagal menghubungi server backend GAS: " + err.toString());
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen pb-12">
          {/* Header Navigation */}
          <header className="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('setup')}>
                <div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-extrabold text-lg shadow-lg shadow-indigo-600/40">
                  N
                </div>
                <div>
                  <h1 className="text-base font-extrabold text-white leading-none">NOS AUDIT SYSTEM</h1>
                  <span className="text-[10px] font-semibold text-slate-400">Monitoring Checklist Cabang</span>
                </div>
              </div>

              {kodeCabang && (
                <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
                  <div className="text-right text-xs">
                    <p className="font-bold text-white">{namaCabang || kodeCabang}</p>
                    <p className="text-[10px] text-slate-400">{namaAuditor || 'Auditor'}</p>
                  </div>
                  <div className="flex gap-1 ml-2">
                    <button 
                      onClick={() => handleStartAudit('dashboard')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition ${view === 'dashboard' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
                    >
                      Dashboard
                    </button>
                    <button 
                      onClick={() => handleStartAudit('form')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition ${view === 'form' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
                    >
                      Form Checklist
                    </button>
                  </div>
                </div>
              )}
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 pt-6">
            
            {/* SCREEN 1: SETUP CABANG & AUDITOR */}
            {view === 'setup' && (
              <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
                <div className="text-center space-y-2">
                  <h2 className="text-2xl font-black text-white">Mulai Audit Cabang</h2>
                  <p className="text-sm text-slate-400">Pilih lokasi cabang dan isi identitas auditor sebelum mengisi checklist</p>
                </div>

                <div className="space-y-4">
                  {/* Select Cabang */}
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-400 mb-2">1. Pilih Cabang</label>
                    <select
                      value={kodeCabang}
                      onChange={(e) => {
                        setKodeCabang(e.target.value);
                        const c = cabangList.find(x => x.kodeCabang === e.target.value);
                        if (c) setNamaCabang(c.namaCabang);
                      }}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500"
                    >
                      <option value="">-- Pilih Cabang (From Master_Cabang) --</option>
                      {cabangList.map((c) => (
                        <option key={c.kodeCabang} value={c.kodeCabang}>
                          {c.kodeCabang} - {c.namaCabang} ({c.region})
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* Input Auditor */}
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-400 mb-2">2. Nama Auditor</label>
                    <input
                      type="text"
                      placeholder="Masukkan nama lengkap auditor..."
                      value={namaAuditor}
                      onChange={(e) => setNamaAuditor(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  {/* Input Jabatan */}
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-400 mb-2">3. Jabatan Auditor</label>
                    <input
                      type="text"
                      placeholder="E.g., Auditor Regional / Supervisor"
                      value={jabatan}
                      onChange={(e) => setJabatan(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div className="pt-4 flex flex-col gap-3">
                  <button
                    onClick={() => handleStartAudit('dashboard')}
                    disabled={loading}
                    className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm disabled:opacity-50"
                  >
                    {loading ? "Menghubungkan ke Google Sheet..." : "Buka Dashboard Audit →"}
                  </button>
                  <button
                    onClick={() => handleStartAudit('form')}
                    disabled={loading}
                    className="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition text-sm disabled:opacity-50"
                  >
                    Langsung Isi Form Checklist →
                  </button>
                </div>
              </div>
            )}

            {/* SCREEN 2: DASHBOARD GAMIFIKASI */}
            {view === 'dashboard' && (
              <DashboardView 
                dashboardData={dashboardData} 
                namaCabang={namaCabang || kodeCabang}
                onGoToForm={(sec) => {
                  setSelectedSection(sec || 'ALL');
                  handleStartAudit('form');
                }}
              />
            )}

            {/* SCREEN 3: FORM CHECKLIST (DENGAN AUTO-SAVE & CAMERA CAPTURE) */}
            {view === 'form' && (
              <FormAuditView 
                kodeCabang={kodeCabang}
                namaCabang={namaCabang}
                namaAuditor={namaAuditor}
                jabatan={jabatan}
                selectedSection={selectedSection}
                setSelectedSection={setSelectedSection}
                checklistItems={checklistItems}
                gasUrl={gasUrl}
                sessionId={sessionId}
                onRefreshItems={() => handleStartAudit('form')}
              />
            )}

          </main>
        </div>
      );
    }

    // ==========================================
    // KOMPONEN DASHBOARD GAMIFIKASI
    // ==========================================
    function DashboardView({ dashboardData, namaCabang, onGoToForm }) {
      const activeTier = TIER_CONFIG[dashboardData.currentTier] || TIER_CONFIG.Bronze;
      const unfinished = dashboardData.unfinishedCounter || {};

      const sections = [
        { key: 'H1 Premises', label: 'H1 Premises' },
        { key: 'H1 People', label: 'H1 People' },
        { key: 'H1 Process', label: 'H1 Process' },
        { key: 'H23 Premises', label: 'H23 Premises' },
        { key: 'H23 People', label: 'H23 People' },
        { key: 'H23 Process', label: 'H23 Process' }
      ];

      return (
        <div className="space-y-8">
          {/* Hero Banner Status Grading */}
          <div className={`relative overflow-hidden rounded-3xl bg-gradient-to-br ${activeTier.gradient} border ${activeTier.border} p-6 md:p-8 shadow-2xl ${activeTier.glow}`}>
            <div className="absolute -right-8 -bottom-8 opacity-10 text-[180px] select-none pointer-events-none">
              {activeTier.icon}
            </div>

            <div className="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-5 text-center md:text-left">
                <span className="text-6xl md:text-8xl filter drop-shadow-xl">{activeTier.icon}</span>
                <div>
                  <span className="text-xs font-bold tracking-widest text-amber-300 uppercase bg-black/40 px-3 py-1 rounded-full border border-white/10">
                    Status Audit Terbaru
                  </span>
                  <h2 className={`text-4xl md:text-6xl font-black ${activeTier.textAccent} mt-2 tracking-tight`}>
                    {activeTier.name}
                  </h2>
                  <p className="text-slate-300 text-sm font-semibold mt-1">{activeTier.subtitle} - {namaCabang}</p>
                </div>
              </div>

              {/* Card Tantangan */}
              <div className="w-full md:max-w-md bg-black/50 backdrop-blur-md border border-white/10 rounded-2xl p-5 space-y-3">
                <span className="text-xs font-bold text-amber-300 uppercase tracking-wider flex items-center gap-1">
                  🔥 Challenge Naik Level
                </span>
                <p className="text-xs md:text-sm text-slate-200 leading-relaxed font-medium">
                  {activeTier.challengeText}
                </p>
              </div>
            </div>
          </div>

          {/* Unfinished Counter Cards */}
          <div className="space-y-4">
            <h3 className="text-lg font-bold text-white flex items-center gap-2">
              📊 Sisa Checklist Belum Dikerjakan Per Section
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {sections.map((sec) => {
                const count = unfinished[sec.key] || 0;
                const isComplete = count === 0;

                return (
                  <div
                    key={sec.key}
                    onClick={() => onGoToForm(sec.key)}
                    className={`rounded-2xl border p-5 transition-all cursor-pointer ${
                      isComplete
                        ? 'bg-emerald-950/20 border-emerald-800/40 hover:border-emerald-500'
                        : count > 5
                        ? 'bg-slate-900 border-rose-900/50 hover:border-rose-500'
                        : 'bg-slate-900 border-slate-800 hover:border-indigo-500'
                    } hover:-translate-y-1 hover:shadow-xl`}
                  >
                    <div className="flex justify-between items-start">
                      <h4 className="font-bold text-white text-base">{sec.label}</h4>
                      <span className="text-xs text-indigo-400 font-bold">Buka →</span>
                    </div>

                    <div className="mt-4 flex items-end justify-between">
                      <div>
                        <span className="text-[10px] text-slate-400 uppercase font-bold">Unfinished Item</span>
                        <div className={`text-3xl font-black ${isComplete ? 'text-emerald-400' : 'text-amber-400'}`}>
                          {count} <span className="text-xs font-normal text-slate-500">Item</span>
                        </div>
                      </div>

                      <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${
                        isComplete ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-300'
                      }`}>
                        {isComplete ? '✓ Selesai' : 'In Progress'}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // KOMPONEN FORM CHECKLIST (AUTO-SAVE & KAMERA)
    // ==========================================
    function FormAuditView({ kodeCabang, namaCabang, namaAuditor, jabatan, selectedSection, setSelectedSection, checklistItems, gasUrl, sessionId, onRefreshItems }) {
      const [answers, setAnswers] = useState({});
      const [saveStatusMap, setSaveStatusMap] = useState({}); // Track 'saving' | 'saved' | 'error' per item ID

      const allSections = Object.keys(checklistItems);
      const currentItems = selectedSection === 'ALL'
        ? Object.values(checklistItems).flat()
        : (checklistItems[selectedSection] || []);

      // FUNGSI AUTO-SAVE: Dikirim otomatis ke Google Sheets setiap kali opsi dipilih / foto diunggah
      const autoSaveSingleItem = async (itemData, updatedAnswer, updatedPhotoBase64) => {
        const itemId = itemData.idChecklist;

        // Set status item ke 'saving'
        setSaveStatusMap(prev => ({ ...prev, [itemId]: 'saving' }));

        try {
          const payload = {
            action: 'submitResponse',
            meta: { kodeCabang, auditor: namaAuditor, sessionId },
            answers: {
              [itemId]: {
                ...itemData,
                hasilPenilaian: updatedAnswer,
                photoBase64: updatedPhotoBase64 || answers[itemId]?.photoBase64 || ''
              }
            }
          };

          const res = await fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (data.status === 'success') {
            setSaveStatusMap(prev => ({ ...prev, [itemId]: 'saved' }));
          } else {
            setSaveStatusMap(prev => ({ ...prev, [itemId]: 'error' }));
          }
        } catch (err) {
          console.error("Auto-save error:", err);
          setSaveStatusMap(prev => ({ ...prev, [itemId]: 'error' }));
        }
      };

      // Handler Ubah Opsi Penilaian
      const handleAnswerChange = (itemData, value) => {
        const itemId = itemData.idChecklist;
        const currentPhoto = answers[itemId]?.photoBase64 || '';

        setAnswers(prev => ({
          ...prev,
          [itemId]: {
            ...itemData,
            hasilPenilaian: value,
            photoBase64: currentPhoto
          }
        }));

        // Triger Auto-Save Langsung
        autoSaveSingleItem(itemData, value, currentPhoto);
      };

      // Handler Tangkap Foto (Kamera/Galeri)
      const handlePhotoChange = (itemData, file) => {
        if (!file) return;
        const itemId = itemData.idChecklist;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Photo = reader.result;
          const currentHasil = answers[itemId]?.hasilPenilaian || itemData.hasilPenilaian || '';

          setAnswers(prev => ({
            ...prev,
            [itemId]: {
              ...itemData,
              hasilPenilaian: currentHasil,
              photoBase64: base64Photo
            }
          }));

          // Jika opsi sudah dipilih, triger Auto-Save ulang bersama fotonya
          if (currentHasil) {
            autoSaveSingleItem(itemData, currentHasil, base64Photo);
          }
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
          
          {/* PANEL KIRI (Informasi Audit & Filter) */}
          <div className="lg:col-span-1 space-y-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Informasi Audit</h3>
              
              <div className="space-y-2 text-sm">
                <div>
                  <span className="text-xs text-slate-500">Cabang</span>
                  <p className="font-bold text-white">{namaCabang || kodeCabang}</p>
                </div>
                <div>
                  <span className="text-xs text-slate-500">Auditor</span>
                  <p className="font-bold text-white">{namaAuditor} ({jabatan || '-'})</p>
                </div>
                <div>
                  <span className="text-xs text-slate-500">Session ID</span>
                  <p className="font-mono text-[10px] text-indigo-400">{sessionId || 'SESS-ACTIVE'}</p>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-800">
                <label className="block text-xs font-bold uppercase text-slate-400 mb-2">Filter Section</label>
                <select
                  value={selectedSection}
                  onChange={(e) => setSelectedSection(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                >
                  <option value="ALL">Semua Section</option>
                  {allSections.map(sec => (
                    <option key={sec} value={sec}>{sec}</option>
                  ))}
                </select>
              </div>
            </div>

            {/* Status Auto-Save Info */}
            <div className="bg-emerald-950/40 border border-emerald-800/60 rounded-2xl p-4 text-emerald-300 text-xs space-y-2">
              <div className="flex items-center gap-2 font-bold text-emerald-400">
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                Auto-Save Aktif
              </div>
              <p className="text-[11px] text-slate-300 leading-relaxed">
                Jawaban otomatis terisi & tersimpan ke Google Sheets saat diklik tanpa perlu tombol manual.
              </p>
              <button
                onClick={onRefreshItems}
                className="w-full mt-2 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-lg text-xs transition"
              >
                🔄 Refresh Progress Item
              </button>
            </div>
          </div>

          {/* PANEL KANAN (Daftar Item Audit) */}
          <div className="lg:col-span-3 space-y-4">
            {currentItems.length === 0 ? (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400">
                <p className="text-base font-bold text-white">Seluruh checklist pada section ini sudah dikerjakan!</p>
                <p className="text-xs mt-1">Pilih section lain pada panel sebelah kiri atau periksa status di Dashboard.</p>
              </div>
            ) : (
              currentItems.map((item, idx) => {
                const itemId = item.idChecklist;
                const currentAnswer = answers[itemId]?.hasilPenilaian || '';
                const currentPhoto = answers[itemId]?.photoBase64 || '';
                const saveState = saveStatusMap[itemId];
                const badge = item.kelasBadge || 'P';

                return (
                  <div key={itemId} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 hover:border-slate-700 transition relative">
                    
                    {/* Header Item & Status Auto-Save */}
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-lg bg-indigo-950 text-indigo-400 font-bold text-xs flex items-center justify-center border border-indigo-800">
                          {idx + 1}
                        </span>
                        <span className="text-xs font-bold text-slate-400">{item.section}</span>
                      </div>

                      <div className="flex items-center gap-2">
                        {/* INDIKATOR STATUS SAVE */}
                        {saveState === 'saving' && (
                          <span className="text-[11px] font-bold text-amber-400 animate-pulse bg-amber-950/60 px-2.5 py-0.5 rounded-full border border-amber-800/60">
                            🔄 Menyimpan...
                          </span>
                        )}
                        {saveState === 'saved' && (
                          <span className="text-[11px] font-bold text-emerald-400 bg-emerald-950/60 px-2.5 py-0.5 rounded-full border border-emerald-800/60">
                            ✅ Tersimpan
                          </span>
                        )}
                        {saveState === 'error' && (
                          <span className="text-[11px] font-bold text-rose-400 bg-rose-950/60 px-2.5 py-0.5 rounded-full border border-rose-800/60">
                            ❌ Gagal Simpan
                          </span>
                        )}

                        {/* BADGE MANDATORY */}
                        {badge === 'S,G,P' && (
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                            🛡️ Silver, Gold, Platinum Mandatory
                          </span>
                        )}
                        {badge === 'G,P' && (
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">
                            ⭐ Gold & Platinum Mandatory
                          </span>
                        )}
                        {badge === 'P' && (
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                            👑 Platinum Mandatory Only
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Content Item */}
                    <div>
                      <h4 className="text-base font-bold text-white">{item.namaItem}</h4>
                      {item.penjelasan && (
                        <p className="text-xs text-slate-400 mt-1 leading-relaxed bg-slate-950/50 p-3 rounded-xl border border-slate-800">
                          {item.penjelasan}
                        </p>
                      )}
                    </div>

                    {/* 4 OPSI HASIL PENILAIAN */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                      {[
                        { label: 'Exist Good', val: 'Exist Good', score: '+1 Point', color: 'peer-checked:bg-emerald-600 peer-checked:border-emerald-400' },
                        { label: 'Exist Not Good', val: 'Exist Not Good', score: '-1 Point', color: 'peer-checked:bg-rose-600 peer-checked:border-rose-400' },
                        { label: 'Not Exist', val: 'Not Exist', score: '0 Point', color: 'peer-checked:bg-slate-700 peer-checked:border-slate-500' },
                        { label: 'N/A', val: 'N/A', score: 'Anulir', color: 'peer-checked:bg-amber-700 peer-checked:border-amber-500' }
                      ].map((opt) => (
                        <label key={opt.val} className="cursor-pointer">
                          <input
                            type="radio"
                            name={`item_${itemId}`}
                            value={opt.val}
                            checked={currentAnswer === opt.val}
                            onChange={() => handleAnswerChange(item, opt.val)}
                            className="peer sr-only"
                          />
                          <div className={`p-3 rounded-xl border border-slate-800 bg-slate-950 text-center transition ${opt.color}`}>
                            <p className="text-xs font-bold text-white">{opt.label}</p>
                            <span className="text-[10px] text-slate-400 font-semibold">{opt.score}</span>
                          </div>
                        </label>
                      ))}
                    </div>

                    {/* AMBIL FOTO BUKTI (KAMERA DIRECT CAPTURE & FILE SELECTOR) */}
                    <div className="pt-2">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div>
                          <label className="block text-[11px] font-bold text-amber-400">
                            📸 Foto Bukti Audit {item.needPhoto ? '(Wajib)' : '(Opsional)'}:
                          </label>
                          <span className="text-[10px] text-slate-400">Ambil langsung via Kamera HP atau pilih file galeri</span>
                        </div>

                        <div className="flex items-center gap-2">
                          <input
                            type="file"
                            id={`photo_${itemId}`}
                            accept="image/*"
                            capture="environment" // MEMBUKA KAMERA BELAKANG OTOMATIS DI SMARTPHONE
                            onChange={(e) => handlePhotoChange(item, e.target.files[0])}
                            className="hidden"
                          />
                          <label
                            htmlFor={`photo_${itemId}`}
                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold cursor-pointer transition flex items-center gap-1.5 shadow-md shadow-indigo-600/30"
                          >
                            <span>📷 Ambil Foto / File</span>
                          </label>
                        </div>
                      </div>

                      {/* Preview Foto Jika Ada */}
                      {currentPhoto && (
                        <div className="mt-2 flex items-center gap-3 bg-slate-950/60 p-2 rounded-xl border border-slate-800">
                          <img src={currentPhoto} alt="Preview Foto Bukti" className="w-12 h-12 object-cover rounded-lg border border-slate-700" />
                          <span className="text-xs text-emerald-400 font-bold">✓ Foto terlampir & siap diunggah ke Drive</span>
                        </div>
                      )}
                    </div>

                  </div>
                );
              })
            )}
          </div>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
