<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Checklist & Dashboard Cabang</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API_URL = "https://script.google.com/macros/s/AKfycbwL8fssAEfYxMchqCb9450jqff6aU4-mR7l-fV28TwWl_1fjYonhcCkYpFxKSQL8-TbyQ/exec";

    const SECTIONS = [
      "H1 Premises", "H1 Process", "H1 People",
      "H23 Premises", "H23 Process", "H23 People"
    ];

    // Helper check badge spesifik
    const hasBadge = (badgeString, targetBadge) => {
      if (!badgeString) return false;
      const badges = String(badgeString).split(",").map(b => b.trim());
      return badges.includes(targetBadge);
    };

    // Helper Priority Item (P, GP, SGP)
    const isPriorityItem = (badgeString) => {
      if (!badgeString) return false;
      const badges = String(badgeString).split(",").map(b => b.trim());
      return badges.some(b => ["P", "GP", "SGP"].includes(b));
    };

    // Render Badge Component
    const renderBadges = (badgeString, isLarge = false) => {
      if (!badgeString) return null;
      const badges = String(badgeString).split(",").map(b => b.trim());
      return badges.map((b, i) => {
        let bg = "bg-slate-100 text-slate-700 border-slate-300";
        if (b === "P") bg = "bg-red-600 text-white border-red-700 font-black shadow-sm animate-pulse";
        else if (b === "GP") bg = "bg-purple-600 text-white border-purple-700 font-black shadow-sm";
        else if (b === "SGP") bg = "bg-indigo-700 text-white border-indigo-900 font-black shadow-sm";
        else if (b === "Mudah") bg = "bg-emerald-100 text-emerald-800 border-emerald-300 font-semibold";
        else if (b === "Murah") bg = "bg-teal-100 text-teal-800 border-teal-300 font-semibold";

        const sizeClass = isLarge ? "text-xs px-2.5 py-1" : "text-[10px] px-2 py-0.5";

        return (
          <span key={i} className={`${sizeClass} rounded-full border ${bg} inline-flex items-center gap-1 shadow-xs`}>
            {(b === 'P' || b === 'GP' || b === 'SGP') && <span>⭐</span>}
            {b}
          </span>
        );
      });
    };

    function App() {
      const [appMode, setAppMode] = React.useState("form");

      // Form States
      const [step, setStep] = React.useState(1);
      const [loading, setLoading] = React.useState(true);
      const [saving, setSaving] = React.useState(false);
      
      const [masterCabang, setMasterCabang] = React.useState([]);
      const [masterChecklist, setMasterChecklist] = React.useState([]);
      const [lockedSections, setLockedSections] = React.useState({});
      const [branchUsers, setBranchUsers] = React.useState([]);

      // Form Identity
      const [selectedCabang, setSelectedCabang] = React.useState("");
      const [namaUser, setNamaUser] = React.useState("");
      const [jabatan, setJabatan] = React.useState("");
      
      // Active Session & Section
      const [selectedSection, setSelectedSection] = React.useState("");
      const [sessionId, setSessionId] = React.useState("");
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [sectionItems, setSectionItems] = React.useState([]);
      
      // Active item temp
      const [selectedRating, setSelectedRating] = React.useState("");
      const [photoBase64, setPhotoBase64] = React.useState("");
      const [showIndicatorModal, setShowIndicatorModal] = React.useState(false);

      // Dashboard States
      const [dashboardData, setDashboardData] = React.useState(null);
      const [dashLoading, setDashLoading] = React.useState(false);
      const [selectedDashCabang, setSelectedDashCabang] = React.useState("ALL");

      React.useEffect(() => {
        fetch(`${API_URL}?action=getInitialData`)
          .then(res => res.json())
          .then(res => {
            if (res.status === "success") {
              setMasterCabang(res.data.masterCabang || []);
              setMasterChecklist(res.data.masterChecklist || []);
            }
            setLoading(false);
          })
          .catch(err => {
            alert("Gagal terhubung ke Google Sheet.");
            setLoading(false);
          });
      }, []);

      const handleCabangChange = (namaCabang) => {
        const cleanNama = String(namaCabang).trim();
        setSelectedCabang(cleanNama);
        setNamaUser("");
        setJabatan("");
        setBranchUsers([]);

        if (!cleanNama) return;

        const branchObj = masterCabang.find(c => String(c.Nama_Cabang).trim() === cleanNama);
        const cleanKode = branchObj && String(branchObj.Kode_Cabang || "").trim() ? String(branchObj.Kode_Cabang).trim() : cleanNama;

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getBranchStatus", kodeCabang: cleanKode })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            setLockedSections(res.data || {});
            
            const userMap = [];
            Object.values(res.data || {}).forEach(item => {
              if (item && item.user && !userMap.some(u => u.nama === item.user)) {
                userMap.push({ nama: item.user, jabatan: item.jabatan || "" });
              }
            });
            setBranchUsers(userMap);
          }
        });
      };

      const loadDashboard = () => {
        setDashLoading(true);
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getDashboardData" })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            setDashboardData(res.data);
          }
          setDashLoading(false);
        })
        .catch(() => setDashLoading(false));
      };

      const handleSwitchMode = (mode) => {
        setAppMode(mode);
        if (mode === "dashboard") {
          loadDashboard();
        }
      };

      const handleBranchSelected = () => {
        if (!selectedCabang || !namaUser || !jabatan) {
          alert("Silakan isi Cabang, Nama, dan Jabatan terlebih dahulu!");
          return;
        }
        setStep(2);
      };

      const handleSelectSection = (sec) => {
        const lock = lockedSections[sec];
        if (lock && lock.status === "COMPLETED") {
          alert("Section ini sudah selesai dikerjakan!");
          return;
        }
        if (lock && lock.status === "IN_PROGRESS" && lock.user !== namaUser) {
          alert(`Section ini sedang dikerjakan oleh ${lock.user}. Silakan pilih section lain.`);
          return;
        }

        setLoading(true);
        setSelectedSection(sec);

        const items = masterChecklist.filter(item => String(item.Section).trim() === String(sec).trim());
        setSectionItems(items);

        const branchObj = masterCabang.find(c => String(c.Nama_Cabang).trim() === String(selectedCabang).trim());
        const kodeCabangKirim = branchObj && String(branchObj.Kode_Cabang || "").trim() ? String(branchObj.Kode_Cabang).trim() : selectedCabang;

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "startOrResumeSession",
            kodeCabang: kodeCabangKirim,
            namaCabang: selectedCabang,
            section: sec,
            namaUser: namaUser,
            jabatan: jabatan
          })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            setSessionId(res.data.sessionId);
            setCurrentIndex(0);
            setStep(3);
          }
          setLoading(false);
        });
      };

      const handleBackToSections = () => {
        if (confirm("Kembali ke daftar pilihan section? Jawaban item yang sudah tersimpan tetap aman.")) {
          setSelectedSection("");
          setSessionId("");
          setCurrentIndex(0);
          setSectionItems([]);
          setSelectedRating("");
          setPhotoBase64("");
          setShowIndicatorModal(false);

          if (selectedCabang) {
            const branchObj = masterCabang.find(c => String(c.Nama_Cabang).trim() === String(selectedCabang).trim());
            const cleanKode = branchObj && String(branchObj.Kode_Cabang || "").trim() ? String(branchObj.Kode_Cabang).trim() : selectedCabang;

            fetch(API_URL, {
              method: "POST",
              body: JSON.stringify({ action: "getBranchStatus", kodeCabang: cleanKode })
            })
            .then(res => res.json())
            .then(res => {
              if (res.status === "success") {
                setLockedSections(res.data || {});
              }
            });
          }

          setStep(2);
        }
      };

      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxWidth = 1000;
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
            setPhotoBase64(compressedBase64);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveAnswer = () => {
        const currentItem = sectionItems[currentIndex];
        if (!selectedRating) {
          alert("Pilih hasil penilaian terlebih dahulu!");
          return;
        }

        const needPhoto = currentItem.Need_Photo === true || String(currentItem.Need_Photo).toUpperCase() === "TRUE";
        const isExist = selectedRating === "Exist Good" || selectedRating === "Exist Not Good";

        if (needPhoto && isExist && !photoBase64) {
          alert("Ceklis ini memerlukan bukti foto. Silakan ambil foto terlebih dahulu!");
          return;
        }

        setSaving(true);
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveAnswer",
            sessionId: sessionId,
            idChecklist: currentItem.ID_Checklist,
            hasilPenilaian: selectedRating,
            imageBase64: photoBase64
          })
        })
        .then(res => res.json())
        .then(res => {
          setSaving(false);
          setSelectedRating("");
          setPhotoBase64("");

          if (currentIndex + 1 < sectionItems.length) {
            setCurrentIndex(currentIndex + 1);
          } else {
            completeCurrentSession();
          }
        });
      };

      // Fungsi Skip Item
      const handleSkipAnswer = () => {
        setSelectedRating("");
        setPhotoBase64("");

        if (currentIndex + 1 < sectionItems.length) {
          setCurrentIndex(currentIndex + 1);
        } else {
          if (confirm("Ini adalah item terakhir pada section ini. Selesaikan section?")) {
            completeCurrentSession();
          }
        }
      };

      const completeCurrentSession = () => {
        setLoading(true);
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "completeSession", sessionId: sessionId })
        })
        .then(res => res.json())
        .then(res => {
          setLoading(false);
          setStep(4);
        });
      };

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
            <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p className="mt-4 text-slate-600 font-medium">Memuat data dari Google Sheet...</p>
          </div>
        );
      }

      return (
        <div className="max-w-md md:max-w-4xl mx-auto min-h-screen bg-white shadow-md flex flex-col">
          {/* Header Navigation Tab */}
          <header className="bg-blue-600 text-white sticky top-0 z-20 shadow-md">
            <div className="p-4 flex items-center justify-between border-b border-blue-500">
              <h1 className="font-bold text-lg">Monitoring NOS Cabang</h1>
              <div className="flex space-x-1 bg-blue-700 p-1 rounded-xl">
                <button 
                  onClick={() => handleSwitchMode("form")} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${appMode === 'form' ? 'bg-white text-blue-700 shadow' : 'text-blue-100'}`}
                >
                  📋 Form Ceklis
                </button>
                <button 
                  onClick={() => handleSwitchMode("dashboard")} 
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${appMode === 'dashboard' ? 'bg-white text-blue-700 shadow' : 'text-blue-100'}`}
                >
                  📊 Dashboard & Grade
                </button>
              </div>
            </div>
          </header>

          <main className="p-4 flex-1">
            {/* VIEW 1: FORM CHECKLIST */}
            {appMode === "form" && (
              <div className="max-w-md mx-auto">
                {step === 1 && (
                  <div className="space-y-4">
                    <div className="border-b pb-2">
                      <h2 className="text-xl font-bold text-slate-800">Identitas Assessor</h2>
                      <p className="text-xs text-slate-500">Pilih cabang dan pendaftaran nama petugas.</p>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-1">Pilih Cabang</label>
                      <select 
                        value={selectedCabang} 
                        onChange={e => handleCabangChange(e.target.value)}
                        className="w-full p-3 border rounded-xl bg-slate-50 text-slate-800 font-medium"
                      >
                        <option value="">-- Pilih Cabang --</option>
                        {masterCabang.map((c, i) => {
                          const kode = String(c.Kode_Cabang || "").trim();
                          const nama = String(c.Nama_Cabang || "").trim();
                          return (
                            <option key={i} value={nama}>
                              {kode ? `${kode} - ` : ""}{nama}
                            </option>
                          );
                        })}
                      </select>
                    </div>

                    {branchUsers.length > 0 && (
                      <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl space-y-1">
                        <label className="block text-xs font-bold text-blue-900">
                          👤 Pilih Petugas Terdaftar (Melanjutkan Pekerjaan):
                        </label>
                        <select
                          onChange={(e) => {
                            const val = e.target.value;
                            if (val) {
                              const found = branchUsers.find(u => u.nama === val);
                              if (found) {
                                setNamaUser(found.nama);
                                setJabatan(found.jabatan);
                              }
                            }
                          }}
                          className="w-full p-2.5 border rounded-lg text-xs bg-white text-slate-800 font-semibold"
                        >
                          <option value="">-- Gunakan Nama Terdaftar --</option>
                          {branchUsers.map((u, i) => (
                            <option key={i} value={u.nama}>{u.nama} ({u.jabatan || 'No Jabatan'})</option>
                          ))}
                        </select>
                      </div>
                    )}

                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-1">Nama Petugas / User</label>
                      <input 
                        type="text" 
                        placeholder="Ketik Nama Lengkap..." 
                        value={namaUser}
                        onChange={e => setNamaUser(e.target.value)}
                        className="w-full p-3 border rounded-xl bg-slate-50 text-slate-800"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-1">Jabatan Assessor / Petugas</label>
                      <input 
                        type="text" 
                        placeholder="Contoh: Auditor / Supervisor" 
                        value={jabatan}
                        onChange={e => setJabatan(e.target.value)}
                        className="w-full p-3 border rounded-xl bg-slate-50 text-slate-800"
                      />
                    </div>

                    <button 
                      onClick={handleBranchSelected}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md mt-4"
                    >
                      Lanjut Pilih Section →
                    </button>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    <div className="border-b pb-2 flex justify-between items-center">
                      <div>
                        <span className="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-semibold">
                          Cabang: {selectedCabang} | {namaUser}
                        </span>
                        <h2 className="text-xl font-bold text-slate-800 mt-2">Pilih Section Pekerjaan</h2>
                      </div>
                      <button onClick={() => setStep(1)} className="text-xs text-blue-600 font-semibold underline">
                        Ganti Identitas
                      </button>
                    </div>

                    <div className="space-y-3">
                      {SECTIONS.map((sec, idx) => {
                        const lock = lockedSections[sec];
                        const isCompleted = lock && lock.status === "COMPLETED";
                        const isInProgressOther = lock && lock.status === "IN_PROGRESS" && lock.user !== namaUser;
                        const isMyProgress = lock && lock.status === "IN_PROGRESS" && lock.user === namaUser;

                        return (
                          <div 
                            key={idx} 
                            onClick={() => !isCompleted && !isInProgressOther && handleSelectSection(sec)}
                            className={`p-4 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                              isCompleted ? "bg-emerald-50 border-emerald-300 opacity-70 cursor-not-allowed" :
                              isInProgressOther ? "bg-amber-50 border-amber-300 opacity-70 cursor-not-allowed" :
                              isMyProgress ? "bg-blue-50 border-blue-400 ring-2 ring-blue-300" :
                              "bg-white border-slate-200 hover:border-blue-400 shadow-sm"
                            }`}
                          >
                            <div>
                              <p className="font-bold text-slate-800">{sec}</p>
                              <p className="text-xs text-slate-500">
                                {isCompleted && `✓ Selesai (${lock.user})`}
                                {isInProgressOther && `⏳ Sedang dikerjakan oleh ${lock.user}`}
                                {isMyProgress && `🔄 Lanjutkan pengerjaan Anda`}
                                {!lock && `Bisa Dikerjakan`}
                              </p>
                            </div>
                            <span className="text-xs font-semibold px-2.5 py-1 rounded-full border">
                              {isCompleted ? "Completed" : isInProgressOther ? "Locked" : "Pilih"}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {step === 3 && sectionItems.length > 0 && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between border-b pb-2">
                      <button 
                        onClick={handleBackToSections}
                        className="flex items-center gap-1.5 text-xs font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 px-3 py-1.5 rounded-xl transition shadow-xs"
                      >
                        <span>🏠</span> Kembali ke Panel Section
                      </button>
                      <span className="text-xs font-semibold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full border">
                        📍 {selectedCabang}
                      </span>
                    </div>

                    <div>
                      <div className="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                        <span className="font-bold text-blue-800">Section: {selectedSection}</span>
                        <span>Item {currentIndex + 1} dari {sectionItems.length}</span>
                      </div>
                      <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-blue-600 h-full transition-all duration-300" 
                          style={{ width: `${((currentIndex + 1) / sectionItems.length) * 100}%` }}
                        ></div>
                      </div>
                    </div>

                    {(() => {
                      const item = sectionItems[currentIndex];
                      const needPhoto = item.Need_Photo === true || String(item.Need_Photo).toUpperCase() === "TRUE";
                      const isPrio = isPriorityItem(item.Kelas_Badge);
                      const pjJabatan = item.Jabatan_Penanggung_Jawab || item.Jabatan_PJ || item["Jabatan Penanggung Jawab"];

                      return (
                        <div className="bg-white border rounded-2xl p-4 shadow-sm space-y-4">
                          <div className={`p-3.5 rounded-2xl border flex items-center justify-between gap-2 ${
                            isPrio 
                              ? "bg-slate-900 text-white border-slate-800 shadow-lg ring-2 ring-red-500/50" 
                              : "bg-slate-100 text-slate-800 border-slate-200"
                          }`}>
                            <div className="flex items-center space-x-2">
                              <span className="text-2xl">{isPrio ? "🚨" : "📌"}</span>
                              <div>
                                <p className="text-[10px] uppercase tracking-wider font-extrabold opacity-75">
                                  SKALA PRIORITAS CEKLIS
                                </p>
                                <p className="text-xs font-bold">
                                  {isPrio ? "WAJIB DIDAHULUKAN / PRIORITAS TINGGI" : "PENGISIAN STANDAR"}
                                </p>
                              </div>
                            </div>
                            <div className="flex items-center flex-wrap gap-1">
                              {renderBadges(item.Kelas_Badge, true)}
                            </div>
                          </div>

                          <div>
                            <div className="mb-2 flex flex-wrap items-center gap-1.5">
                              {needPhoto && (
                                <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full border border-purple-300 font-bold">
                                  📷 Wajib Foto Bukti
                                </span>
                              )}
                              {pjJabatan && (
                                <span className="text-xs bg-indigo-100 text-indigo-800 border border-indigo-300 px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1">
                                  👔 PJ: {pjJabatan}
                                </span>
                              )}
                            </div>
                            <h3 className="text-lg font-bold text-slate-800">{item.No_Item}. {item.Nama_Item}</h3>
                          </div>

                          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-2">
                            <div className="flex justify-between items-center border-b border-amber-200 pb-1">
                              <span className="text-xs font-bold text-amber-900 flex items-center gap-1">
                                📋 Indikator & Panduan Penilaian
                              </span>
                              <button 
                                onClick={() => setShowIndicatorModal(true)}
                                className="text-[11px] bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold px-2 py-0.5 rounded transition"
                              >
                                🔍 Perbesar
                              </button>
                            </div>

                            {pjJabatan && (
                              <div className="bg-amber-100/80 p-2 rounded-lg text-xs font-bold text-amber-950 flex items-center gap-1.5 border border-amber-300">
                                <span>👔</span>
                                <span>Jabatan Penanggung Jawab (Yang Diperiksa): <u className="text-blue-900">{pjJabatan}</u></span>
                              </div>
                            )}

                            <div className="text-xs text-slate-700 whitespace-pre-line leading-relaxed max-h-36 overflow-y-auto pr-1">
                              {item.Penjelasan_Indikator}
                            </div>
                          </div>

                          <div className="space-y-2">
                            <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">Hasil Penilaian</label>
                            <div className="grid grid-cols-2 gap-2">
                              {[
                                { label: "Exist Good", color: "border-emerald-500 bg-emerald-50 text-emerald-800" },
                                { label: "Exist Not Good", color: "border-amber-500 bg-amber-50 text-amber-800" },
                                { label: "Not Exist", color: "border-rose-500 bg-rose-50 text-rose-800" },
                                { label: "Not Available", color: "border-slate-400 bg-slate-50 text-slate-700" }
                              ].map((opt, i) => (
                                <button
                                  key={i}
                                  onClick={() => setSelectedRating(opt.label)}
                                  className={`p-3 rounded-xl border-2 font-bold text-xs text-center transition ${
                                    selectedRating === opt.label ? `${opt.color} ring-2 ring-blue-400 shadow-sm` : "border-slate-200 bg-white text-slate-700"
                                  }`}
                                >
                                  {opt.label}
                                </button>
                              ))}
                            </div>
                          </div>

                          {needPhoto && (selectedRating === "Exist Good" || selectedRating === "Exist Not Good") && (
                            <div className="border-t pt-3 space-y-2">
                              <label className="block text-xs font-bold text-slate-700">Bukti Foto (Wajib)</label>
                              {photoBase64 ? (
                                <div className="relative rounded-xl overflow-hidden border border-slate-300">
                                  <img src={photoBase64} alt="Evidence" className="w-full h-40 object-cover" />
                                  <button 
                                    onClick={() => setPhotoBase64("")}
                                    className="absolute top-2 right-2 bg-rose-600 text-white text-xs px-2 py-1 rounded-lg shadow"
                                  >
                                    Hapus / Foto Ulang
                                  </button>
                                </div>
                              ) : (
                                <label className="flex flex-col items-center justify-center p-4 border-2 border-dashed border-blue-300 rounded-xl bg-blue-50 cursor-pointer">
                                  <span className="text-2xl mb-1">📷</span>
                                  <span className="text-xs font-bold text-blue-700">Ambil Foto dari Kamera</span>
                                  <input 
                                    type="file" 
                                    accept="image/*" 
                                    capture="environment" 
                                    onChange={handlePhotoCapture} 
                                    className="hidden" 
                                  />
                                </label>
                              )}
                            </div>
                          )}

                          {/* DUA TOMBOL: SKIP DAN SIMPAN */}
                          <div className="flex gap-2 pt-2">
                            <button 
                              type="button"
                              disabled={saving}
                              onClick={handleSkipAnswer}
                              className="w-1/3 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-3.5 rounded-xl transition text-xs md:text-sm flex items-center justify-center gap-1 border border-amber-200"
                              title="Lewati item ini terlebih dahulu"
                            >
                              <span>⏭️</span> Skip
                            </button>

                            <button 
                              type="button"
                              disabled={saving}
                              onClick={handleSaveAnswer}
                              className="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md text-xs md:text-sm"
                            >
                              {saving ? "Menyimpan..." : "Simpan & Lanjut →"}
                            </button>
                          </div>
                        </div>
                      );
                    })()}

                    {/* MODAL PERBESAR INDIKATOR */}
                    {showIndicatorModal && (
                      <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-xs">
                        <div className="bg-white rounded-2xl p-5 max-w-lg w-full space-y-4 shadow-2xl border">
                          <div className="flex justify-between items-center border-b pb-2">
                            <h4 className="font-bold text-slate-800 text-base">📖 Indikator & Panduan Penilaian</h4>
                            <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">Item {sectionItems[currentIndex]?.No_Item}</span>
                          </div>

                          {(sectionItems[currentIndex]?.Jabatan_Penanggung_Jawab || sectionItems[currentIndex]?.Jabatan_PJ) && (
                            <div className="bg-blue-50 border border-blue-200 text-blue-900 p-2.5 rounded-xl text-xs font-bold flex items-center gap-2">
                              <span>👔</span>
                              <span>Penanggung Jawab Item: {sectionItems[currentIndex]?.Jabatan_Penanggung_Jawab || sectionItems[currentIndex]?.Jabatan_PJ}</span>
                            </div>
                          )}

                          <div className="text-xs md:text-sm text-slate-700 whitespace-pre-wrap leading-relaxed max-h-80 overflow-y-auto p-3 bg-slate-50 rounded-xl border">
                            {sectionItems[currentIndex]?.Penjelasan_Indikator}
                          </div>

                          <button
                            onClick={() => setShowIndicatorModal(false)}
                            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl transition text-xs md:text-sm"
                          >
                            Tutup Modal
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* STEP 4: SELESAI */}
                {step === 4 && (
                  <div className="text-center py-10 space-y-4 bg-white border rounded-2xl p-6 shadow-sm">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-black">
                      ✓
                    </div>
                    <h2 className="text-2xl font-bold text-slate-800">Section Selesai!</h2>
                    <p className="text-sm text-slate-600">
                      Semua item pada section <strong className="text-blue-700">{selectedSection}</strong> telah berhasil diselesaikan dan tersimpan.
                    </p>
                    <button
                      onClick={() => {
                        setSelectedSection("");
                        setSessionId("");
                        setCurrentIndex(0);
                        setSectionItems([]);
                        setSelectedRating("");
                        setPhotoBase64("");
                        setStep(2);
                        if (selectedCabang) {
                          const branchObj = masterCabang.find(c => String(c.Nama_Cabang).trim() === String(selectedCabang).trim());
                          const cleanKode = branchObj && String(branchObj.Kode_Cabang || "").trim() ? String(branchObj.Kode_Cabang).trim() : selectedCabang;
                          fetch(API_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "getBranchStatus", kodeCabang: cleanKode })
                          })
                          .then(res => res.json())
                          .then(res => {
                            if (res.status === "success") {
                              setLockedSections(res.data || {});
                            }
                          });
                        }
                      }}
                      className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition shadow-md w-full"
                    >
                      Kembali ke Pilihan Section
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* VIEW 2: DASHBOARD */}
            {appMode === "dashboard" && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">📊 Dashboard Performance & Grade</h2>
                    <p className="text-xs text-slate-500">Ringkasan hasil monitoring audit cabang.</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <label className="text-xs font-bold text-slate-600">Filter Cabang:</label>
                    <select
                      value={selectedDashCabang}
                      onChange={(e) => setSelectedDashCabang(e.target.value)}
                      className="p-2 border rounded-xl bg-slate-50 text-xs font-semibold text-slate-800"
                    >
                      <option value="ALL">Semua Cabang</option>
                      {masterCabang.map((c, i) => (
                        <option key={i} value={c.Nama_Cabang}>{c.Nama_Cabang}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {dashLoading ? (
                  <div className="text-center py-12">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    <p className="text-xs font-semibold text-slate-500">Memuat data dashboard...</p>
                  </div>
                ) : !dashboardData ? (
                  <div className="text-center py-12 text-slate-500 text-sm">
                    Tidak ada data dashboard yang tersedia.
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                      <div className="bg-blue-50 border border-blue-200 p-4 rounded-2xl">
                        <p className="text-xs font-bold text-blue-600 uppercase">Total Cabang</p>
                        <p className="text-2xl font-black text-blue-900 mt-1">{dashboardData.totalCabang || 0}</p>
                      </div>
                      <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                        <p className="text-xs font-bold text-emerald-600 uppercase">Avg Compliance</p>
                        <p className="text-2xl font-black text-emerald-900 mt-1">{dashboardData.avgScore || 0}%</p>
                      </div>
                      <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl">
                        <p className="text-xs font-bold text-amber-600 uppercase">Section Selesai</p>
                        <p className="text-2xl font-black text-amber-900 mt-1">{dashboardData.completedSections || 0}</p>
                      </div>
                      <div className="bg-purple-50 border border-purple-200 p-4 rounded-2xl">
                        <p className="text-xs font-bold text-purple-600 uppercase">Grade Nasional</p>
                        <p className="text-2xl font-black text-purple-900 mt-1">{dashboardData.overallGrade || "N/A"}</p>
                      </div>
                    </div>

                    <div className="bg-white border rounded-2xl p-4 shadow-xs space-y-4">
                      <h3 className="font-bold text-slate-800 text-sm">Detail Pencapaian Cabang</h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-slate-700">
                          <thead className="bg-slate-100 text-slate-600 uppercase text-[10px]">
                            <tr>
                              <th className="p-2.5">Cabang</th>
                              <th className="p-2.5">Progress</th>
                              <th className="p-2.5">Score</th>
                              <th className="p-2.5">Grade</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y">
                            {(dashboardData.branches || [])
                              .filter(b => selectedDashCabang === "ALL" || b.nama === selectedDashCabang)
                              .map((b, idx) => (
                                <tr key={idx} className="hover:bg-slate-50">
                                  <td className="p-2.5 font-bold text-slate-800">{b.nama}</td>
                                  <td className="p-2.5">{b.progress}%</td>
                                  <td className="p-2.5 font-semibold">{b.score}%</td>
                                  <td className="p-2.5">
                                    <span className={`px-2 py-0.5 rounded-md font-bold text-[10px] ${
                                      b.grade === 'A' ? 'bg-emerald-100 text-emerald-800' :
                                      b.grade === 'B' ? 'bg-blue-100 text-blue-800' :
                                      b.grade === 'C' ? 'bg-amber-100 text-amber-800' :
                                      'bg-rose-100 text-rose-800'
                                    }`}>
                                      Grade {b.grade}
                                    </span>
                                  </td>
                                </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    // Render React 18 Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
