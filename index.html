<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Audit NOS Cabang</title>
  <!-- Tailwind CSS CDN untuk Tampilan Modern & Responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <div class="bg-blue-700 text-white py-6 px-4 shadow-md mb-8">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-2xl md:text-3xl font-bold">Aplikasi Web Audit NOS</h1>
      <p class="text-blue-100 text-sm mt-1">Sistem Input Monitoring & Checklist Cabang</p>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-4">
    <form id="auditForm" onsubmit="submitForm(event)">
      
      <!-- CARD 1: INFORMASI AUDITOR & CABANG -->
      <div class="bg-white rounded-lg shadow-sm p-6 mb-6 border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b">1. Informasi Audit & Cabang</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Cabang *</label>
            <select id="cabang" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">-- Memuat daftar cabang... --</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Auditor *</label>
            <input type="text" id="auditor" required placeholder="Nama Lengkap Auditor" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">No. Telepon / WA *</label>
            <input type="tel" id="phone" required placeholder="08xxxxxxxxxx" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Jabatan *</label>
            <input type="text" id="jabatan" required placeholder="Contoh: Area Manager / Supervisor" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

        </div>
      </div>

      <!-- CARD 2: CHECKLIST AUDIT -->
      <div class="bg-white rounded-lg shadow-sm p-6 mb-6 border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b">2. Form Penilaian Checklist</h2>
        <div id="checklistContainer" class="space-y-6">
          <p class="text-slate-500 italic text-center py-4">Memuat daftar item audit...</p>
        </div>
      </div>

      <!-- CARD 3: TOMBOL SUBMIT -->
      <div class="flex justify-end">
        <button type="submit" id="btnSubmit" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
          <span>Kirim Hasil Audit</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    // =========================================================================
    // PASTE URL WEB APP DARI GOOGLE APPS SCRIPT KAKAK DI BAWAH INI:
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxusK0G3dEYkmUziYS1TtfdAasHUI6gNBkCq_PQMUZjPfmxl3TAQ6wH6IG-3SgN0vQTiA/exec";

    let globalChecklistData = {};

    // Inisialisasi Saat Halaman Dimuat
    document.addEventListener("DOMContentLoaded", function() {
      fetchCabang();
      fetchChecklist();
    });

    // 1. Ambil Daftar Cabang dari Google Apps Script
    async function fetchCabang() {
      const selectCabang = document.getElementById("cabang");
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getCabang`);
        const list = await response.json();
        
        selectCabang.innerHTML = '<option value="">-- Pilih Cabang --</option>';
        list.forEach(item => {
          const opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          selectCabang.appendChild(opt);
        });
      } catch (err) {
        console.error("Gagal mengambil daftar cabang:", err);
        selectCabang.innerHTML = '<option value="">Gagal memuat cabang</option>';
      }
    }

    // 2. Ambil Daftar Master Checklist dari Google Apps Script
    async function fetchChecklist() {
      const container = document.getElementById("checklistContainer");
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getChecklist`);
        globalChecklistData = await response.json();
        
        container.innerHTML = "";
        
        // Loop per Section/Kategori Checklist
        Object.keys(globalChecklistData).forEach((sectionName, index) => {
          const sectionDiv = document.createElement("div");
          sectionDiv.className = "border border-slate-200 rounded-lg p-4 bg-slate-50/50 mb-4";
          
          let html = `<h3 class="font-bold text-blue-700 border-b pb-2 mb-4 text-md">${sectionName}</h3>`;
          
          globalChecklistData[sectionName].forEach((item) => {
            html += `
              <div class="bg-white p-4 rounded border border-slate-200 mb-4 shadow-sm" id="card_item_${item.id}">
                <div class="flex justify-between items-start mb-2">
                  <p class="font-semibold text-slate-800 text-sm md:text-base">${item.noItem}. ${item.title}</p>
                  <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800">Badge: ${item.Kelas_Badge}</span>
                </div>
                
                ${item.panduan && item.panduan.length ? `<p class="text-xs text-slate-500 mb-3 italic">Panduan: ${item.panduan.join(', ')}</p>` : ''}
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
                  <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Penilaian *</label>
                    <select id="hasil_${item.id}" required class="w-full text-sm p-2 bg-slate-50 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
                      <option value="">-- Pilih --</option>
                      <option value="Exist Good (EG)">Exist Good (EG)</option>
                      <option value="Exist Not Good (ENG)">Exist Not Good (ENG)</option>
                      <option value="Not Exist (NE)">Not Exist (NE)</option>
                      <option value="Not Available (NA)">Not Available (NA)</option>
                    </select>
                  </div>
                  
                  <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Catatan Temuan</label>
                    <input type="text" id="catatan_${item.id}" placeholder="Keterangan / Temuan" class="w-full text-sm p-2 bg-slate-50 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
                  </div>
                  
                  <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Foto Bukti ${item.wajibFoto ? '<span class="text-red-500">*</span>' : ''}</label>
                    <input type="file" id="foto_${item.id}" accept="image/*" ${item.wajibFoto ? 'required' : ''} class="w-full text-xs p-1 bg-slate-50 border border-slate-300 rounded">
                  </div>
                </div>
              </div>
            `;
          });
          
          sectionDiv.innerHTML = html;
          container.appendChild(sectionDiv);
        });

      } catch (err) {
        console.error("Gagal mengambil checklist:", err);
        container.innerHTML = `<p class="text-red-500 text-center py-4">Gagal memuat master checklist. Periksa koneksi atau URL Apps Script.</p>`;
      }
    }

    // Fungsi Pembantu: Kompres Foto ke Base64 agar tidak melebihi batas Google Sheets
    function processImage(file) {
      return new Promise((resolve) => {
        if (!file) resolve("-");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600; // Resize lebar foto max 600px
            const scale = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            // Kompres kualitas gambar ke JPEG 0.6
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
        };
      });
    }

    // 3. Kirim Data Audit ke Google Apps Script (doPost)
    async function submitForm(event) {
      event.preventDefault();
      
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span>Mengirim...</span>`;

      try {
        // Susun objek Meta Data Auditor
        const meta = {
          cabang: document.getElementById("cabang").value,
          auditor: document.getElementById("auditor").value,
          phone: document.getElementById("phone").value,
          jabatan: document.getElementById("jabatan").value
        };

        // Susun objek Hasil Penilaian
        const answers = {};

        for (const sectionName of Object.keys(globalChecklistData)) {
          for (const item of globalChecklistData[sectionName]) {
            const hasilVal = document.getElementById(`hasil_${item.id}`).value;
            const catatanVal = document.getElementById(`catatan_${item.id}`).value;
            const photoInput = document.getElementById(`foto_${item.id}`);
            const photoFile = photoInput.files[0] || null;

            // Process kompresi foto jika ada
            const photoBase64 = await processImage(photoFile);

            // Hitung poin sederhana (misal EG = 10, selain itu 0)
            let poin = 0;
            if (hasilVal === "Exist Good (EG)") poin = item.poinStandar || 10;

            answers[item.id] = {
              idChecklist: item.id,
              section: sectionName,
              title: item.title,
              Kelas_Badge: item.Kelas_Badge,
              hasil: hasilVal,
              poin: poin,
              catatan: catatanVal || "-",
              photoBase64: photoBase64
            };
          }
        }

        const payload = { meta: meta, answers: answers };

        // Kirim request POST ke Apps Script
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("Berhasil! Data hasil audit telah disimpan ke Google Sheet.");
          document.getElementById("auditForm").reset();
        } else {
          alert("Gagal menyimpan data: " + result.message);
        }

      } catch (err) {
        console.error("Error submit:", err);
        alert("Terjadi kesalahan saat mengirim data. Pastikan koneksi internet stabil.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Kirim Hasil Audit</span>`;
      }
    }
  </script>
</body>
</html>
