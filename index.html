<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOS Cabang - Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">NOS Cabang</h1>
    <span id="locationBadge" class="bg-blue-800 text-xs px-3 py-1 rounded-full font-semibold">CIKARANG</span>
  </header>

  <main class="max-w-3xl mx-auto p-4">
    <!-- Status Loading -->
    <div id="loading" class="text-center py-10">
      <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-2"></i>
      <p class="text-gray-600 font-medium" id="loadingText">Memuat data dari Google Sheet...</p>
    </div>

    <!-- Container Form Checklist -->
    <div id="app" class="hidden bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
      
      <!-- Top Sub-Header -->
      <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
        <div>
          <span id="sectionName" class="text-xs font-bold text-blue-600 uppercase tracking-wider">SECTION: H1 PREMISES</span>
          <h2 id="itemCounter" class="text-xs text-slate-500 font-semibold">Item 1 dari 1</h2>
        </div>
        <span id="badgePriority" class="bg-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded font-bold tracking-widest">S G P</span>
      </div>

      <div class="p-5 space-y-5">
        
        <!-- Badge Mandatory Foto & PJ -->
        <div class="flex flex-wrap gap-2">
          <span id="badgeFoto" class="bg-purple-100 text-purple-700 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1">
            <i class="fas fa-camera"></i> <span id="textFoto">Wajib Foto Bukti</span>
          </span>
          <span id="badgePJ" class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1">
            <i class="fas fa-user"></i> PJ: <span id="textPJ">-</span>
          </span>
        </div>

        <!-- Judul Item -->
        <h3 id="itemTitle" class="text-xl font-bold text-slate-800">1. Nama Item</h3>

        <!-- Indikator & Panduan Penilaian -->
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 space-y-2">
          <div class="text-amber-800 font-semibold text-sm flex items-center gap-2">
            <i class="fas fa-scroll"></i> Indikator & Panduan Penilaian
          </div>
          <ul id="panduanList" class="text-xs text-amber-900 space-y-1 list-disc list-inside leading-relaxed">
          </ul>
        </div>

        <!-- HASIL PENILAIAN -->
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Hasil Penilaian</label>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="selectOption('Exist Good')" id="btn-Exist Good" class="opt-btn p-3 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-blue-50 transition">Exist Good</button>
            <button onclick="selectOption('Exist Not Good')" id="btn-Exist Not Good" class="opt-btn p-3 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-blue-50 transition">Exist Not Good</button>
            <button onclick="selectOption('Not Exist')" id="btn-Not Exist" class="opt-btn p-3 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-blue-50 transition">Not Exist</button>
            <button onclick="selectOption('Not Available')" id="btn-Not Available" class="opt-btn p-3 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-blue-50 transition">Not Available</button>
          </div>
        </div>

        <!-- AREA UPLOAD FOTO BUKTI -->
        <div id="photoSection" class="border-2 border-dashed border-slate-300 rounded-lg p-4 bg-slate-50 text-center">
          <label class="block text-xs font-bold text-slate-600 uppercase mb-2">
            Upload Foto Bukti <span id="photoMandatoryLabel" class="text-red-500">* (Wajib)</span>
          </label>

          <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(event)">
          
          <button type="button" onclick="document.getElementById('fileInput').click()" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-100 flex items-center justify-center gap-2 mx-auto">
            <i class="fas fa-camera text-blue-600 text-lg"></i>
            <span>Ambil / Pilih Foto</span>
          </button>

          <!-- Preview Foto -->
          <div id="previewContainer" class="hidden mt-3 relative inline-block">
            <img id="imgPreview" class="h-32 w-auto rounded-lg border shadow-md object-cover">
            <button onclick="removePhoto()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center shadow">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <!-- Tombol Navigasi -->
        <div class="flex gap-3 pt-3">
          <button id="btnPrev" onclick="prevItem()" class="w-1/3 bg-slate-200 text-slate-600 font-semibold py-3 rounded-lg hover:bg-slate-300 transition">
            ← Sebelumnya
          </button>
          <button id="btnNext" onclick="nextItem()" class="w-2/3 bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 transition">
            Simpan & Lanjut →
          </button>
        </div>

      </div>
    </div>
  </main>

  <script>
    // =======================================================
    // PASTE URL WEB APP YANG ANDA COPY DARI LANGKAH 3 DI SINI
    // =======================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHd6NWMIwG5ZlCBNZc3-WFh-4SEFwlxP1cMR8xMi1_9SZux14ehlgJ_D7z75bGqofgWA/exec"; 

    let itemsData = [];
    let answersStore = {}; 
    let currentIndex = 0;
    let selectedResult = "";
    let uploadedPhotoBase64 = "";

    window.onload = function() {
      fetchChecklistData();
    };

    function fetchChecklistData() {
      if(!WEB_APP_URL || WEB_APP_URL.includes("PASTE_URL_WEB_APP")) {
        alert("URL Web App belum diisi di index.html! Silakan paste URL dari Langkah 3.");
        return;
      }

      fetch(`${WEB_APP_URL}?action=getChecklist`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').classList.add('hidden');
          
          itemsData = [];
          for (let sec in data) {
            data[sec].forEach(item => {
              item.sectionName = sec;
              itemsData.push(item);
            });
          }

          if(itemsData.length > 0) {
            document.getElementById('app').classList.remove('hidden');
            renderItem(0);
          } else {
            alert("Data checklist kosong atau tab 'Master_Checklist' tidak ditemukan.");
          }
        })
        .catch(err => {
          console.error(err);
          alert("Gagal mengambil data dari Google Sheet. Pastikan akses deployment sudah 'Anyone'!");
        });
    }

    function renderItem(index) {
      const item = itemsData[index];
      if(!item) return;

      const saved = answersStore[index] || {};
      selectedResult = saved.hasil || "";
      uploadedPhotoBase64 = saved.photoBase64 || "";

      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.className = "opt-btn p-3 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-blue-50 transition";
      });
      if(selectedResult) {
        const activeBtn = document.getElementById(`btn-${selectedResult}`);
        if(activeBtn) activeBtn.className = "opt-btn p-3 text-sm font-bold rounded-lg border-2 border-blue-600 bg-blue-600 text-white transition";
      }

      if(uploadedPhotoBase64) {
        document.getElementById('imgPreview').src = uploadedPhotoBase64;
        document.getElementById('previewContainer').classList.remove('hidden');
      } else {
        document.getElementById('previewContainer').classList.add('hidden');
        document.getElementById('fileInput').value = "";
      }

      document.getElementById('sectionName').innerText = `SECTION: ${item.sectionName || 'H1 PREMISES'}`;
      document.getElementById('itemCounter').innerText = `Item ${index + 1} dari ${itemsData.length}`;
      document.getElementById('badgePriority').innerText = item.priorityCode || "S G P";
      document.getElementById('itemTitle').innerText = `${item.noItem || (index + 1)}. ${item.title}`;
      document.getElementById('textPJ').innerText = item.pj || "-";

      const badgeFoto = document.getElementById('badgeFoto');
      const photoMandatoryLabel = document.getElementById('photoMandatoryLabel');
      if(item.wajibFoto) {
        badgeFoto.className = "bg-purple-100 text-purple-700 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1";
        document.getElementById('textFoto').innerText = "Wajib Foto Bukti";
        photoMandatoryLabel.style.display = "inline";
      } else {
        badgeFoto.className = "bg-slate-100 text-slate-500 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1";
        document.getElementById('textFoto').innerText = "Foto Opsional";
        photoMandatoryLabel.style.display = "none";
      }

      const panduanList = document.getElementById('panduanList');
      panduanList.innerHTML = "";
      if(Array.isArray(item.panduan) && item.panduan.length > 0) {
        item.panduan.forEach(p => {
          if(p.trim() !== "") {
            const li = document.createElement('li');
            li.innerText = p;
            panduanList.appendChild(li);
          }
        });
      }

      document.getElementById('btnPrev').disabled = (index === 0);
      document.getElementById('btnPrev').style.opacity = (index === 0) ? "0.5" : "1";
      
      const btnNext = document.getElementById('btnNext');
      if(index === itemsData.length - 1) {
        btnNext.innerText = "Kirim Semua Hasil Audit 🚀";
        btnNext.className = "w-2/3 bg-green-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-green-700 transition";
      } else {
        btnNext.innerText = "Simpan & Lanjut →";
        btnNext.className = "w-2/3 bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 transition";
      }
    }

    function selectOption(val) {
      selectedResult = val;
      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.className = "opt-btn p-3 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-blue-50 transition";
      });
      const activeBtn = document.getElementById(`btn-${val}`);
      if(activeBtn) {
        activeBtn.className = "opt-btn p-3 text-sm font-bold rounded-lg border-2 border-blue-600 bg-blue-600 text-white transition";
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedPhotoBase64 = e.target.result;
          document.getElementById('imgPreview').src = e.target.result;
          document.getElementById('previewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function removePhoto() {
      uploadedPhotoBase64 = "";
      document.getElementById('fileInput').value = "";
      document.getElementById('previewContainer').classList.add('hidden');
    }

    function nextItem() {
      const currentItem = itemsData[currentIndex];

      if(!selectedResult) {
        alert("Silakan pilih Hasil Penilaian terlebih dahulu.");
        return;
      }

      if(currentItem.wajibFoto && !uploadedPhotoBase64) {
        alert("Item ini WAJIB melampirkan foto bukti!");
        return;
      }

      let poin = 0;
      if(selectedResult === "Exist Good") poin = currentItem.poinStandar || 10;

      answersStore[currentIndex] = {
        idChecklist: currentItem.id,
        section: currentItem.sectionName,
        title: currentItem.title,
        hasil: selectedResult,
        poin: poin,
        photoBase64: uploadedPhotoBase64
      };

      if(currentIndex < itemsData.length - 1) {
        currentIndex++;
        renderItem(currentIndex);
      } else {
        submitAuditData();
      }
    }

    function prevItem() {
      if(currentIndex > 0) {
        currentIndex--;
        renderItem(currentIndex);
      }
    }

    function submitAuditData() {
      if(!confirm("Apakah Anda yakin ingin mengirimkan seluruh hasil audit ini ke Google Sheets?")) return;

      document.getElementById('app').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('loadingText').innerText = "Mengirim data audit & menyimpan foto ke Google Drive...";

      const payload = {
        cabang: "CIKARANG",
        auditor: "Auditor Cabang",
        answers: Object.values(answersStore)
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        document.getElementById('loading').classList.add('hidden');
        if(res.status === "SUCCESS") {
          alert("BERHASIL! Data audit dan foto bukti telah tersimpan di Google Sheets & Google Drive.");
          location.reload();
        } else {
          alert("Gagal menyimpan data: " + res.error);
          document.getElementById('app').classList.remove('hidden');
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        alert("Terjadi kesalahan koneksi saat mengirim data.");
      });
    }
  </script>
</body>
</html>
